<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTDL — YouTube Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --red: #ff2d2d;
    --red-dim: #ff2d2d22;
    --white: #f0ede8;
    --gray: #666;
    --gray2: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,45,45,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,45,45,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease both;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }

  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 4px;
    color: var(--white);
    line-height: 1;
  }

  .logo-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--red);
    background: var(--red-dim);
    border: 1px solid var(--red);
    padding: 3px 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .tagline {
    font-size: 14px;
    color: var(--gray);
    letter-spacing: 0.5px;
    font-weight: 300;
  }

  /* URL Input Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 16px;
  }

  .url-row {
    display: flex;
    gap: 10px;
  }

  .url-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.2s;
  }

  .url-input:focus {
    border-color: var(--red);
  }

  .url-input::placeholder { color: var(--gray2); }

  .btn {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: #e62222; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { background: var(--gray2); cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--white);
  }
  .btn-ghost:hover { background: var(--surface2); border-color: var(--gray); }

  /* Video Info */
  .video-info {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }

  .video-info.show { display: flex; gap: 20px; }

  .thumb-wrap {
    width: 140px;
    flex-shrink: 0;
  }

  .thumb-wrap img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }

  .video-meta { flex: 1; min-width: 0; }

  .video-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .video-sub {
    font-size: 12px;
    color: var(--gray);
    font-family: 'DM Mono', monospace;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .video-sub span { display: flex; align-items: center; gap: 5px; }

  /* Options */
  .options-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }

  .options-card.show { display: block; }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .opt-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
  }

  .toggle-group {
    display: flex;
    gap: 8px;
  }

  .toggle-btn {
    flex: 1;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--gray);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .toggle-btn.active {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
  }

  .select-styled {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 10px 14px;
    outline: none;
    appearance: none;
    cursor: pointer;
  }

  .select-styled:focus { border-color: var(--red); }

  .dl-btn-wrap { text-align: right; }

  .btn-download {
    padding: 16px 40px;
    font-size: 14px;
    letter-spacing: 2px;
  }

  /* Progress */
  .progress-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }

  .progress-card.show { display: block; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .progress-status {
    font-size: 13px;
    font-weight: 500;
  }

  .progress-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gray);
  }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-bar {
    height: 100%;
    background: var(--red);
    width: 0%;
    transition: width 0.4s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute;
    right: 0;
    top: -3px;
    width: 2px;
    height: 9px;
    background: #ff6b6b;
    box-shadow: 0 0 8px #ff2d2d;
  }

  .progress-pct {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 2px;
    color: var(--white);
    line-height: 1;
  }

  .progress-pct span {
    font-size: 20px;
    color: var(--gray);
  }

  /* Done */
  .done-card {
    display: none;
    background: var(--surface);
    border: 1px solid #1a3a1a;
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }

  .done-card.show { display: block; }

  .done-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .done-icon {
    width: 36px;
    height: 36px;
    background: #1a3a1a;
    border: 1px solid #2a5a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .done-title { font-size: 15px; font-weight: 600; color: #4ade80; }
  .done-sub { font-size: 12px; color: var(--gray); margin-top: 2px; }

  .done-actions { display: flex; gap: 10px; }

  /* Error */
  .error-msg {
    display: none;
    background: #1a0808;
    border: 1px solid #3a1212;
    padding: 16px 20px;
    font-size: 13px;
    color: #f87171;
    font-family: 'DM Mono', monospace;
    margin-bottom: 20px;
    animation: fadeUp 0.3s ease both;
  }

  .error-msg.show { display: block; }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* Footer */
  .footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .footer-note {
    font-size: 11px;
    color: var(--gray2);
    font-family: 'DM Mono', monospace;
    line-height: 1.6;
  }

  .footer-note a { color: var(--gray); text-decoration: none; }
  .footer-note a:hover { color: var(--white); }

  .footer-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gray2);
    letter-spacing: 2px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 540px) {
    .logo-main { font-size: 52px; }
    .options-grid { grid-template-columns: 1fr; }
    .video-info.show { flex-direction: column; }
    .thumb-wrap { width: 100%; }
    .url-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-main">YTDL</div>
      <div class="logo-tag">v2.0</div>
    </div>
    <div class="tagline">Download YouTube videos and audio — fast, clean, no nonsense.</div>
  </div>

  <!-- URL Input -->
  <div class="card">
    <div class="section-label">— Paste URL</div>
    <div class="url-row">
      <input class="url-input" id="urlInput" type="text" placeholder="https://youtube.com/watch?v=..." />
      <button class="btn" id="fetchBtn" onclick="fetchInfo()">Fetch</button>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Video Info -->
  <div class="video-info" id="videoInfo">
    <div class="thumb-wrap">
      <img id="thumbnail" src="" alt="thumbnail" />
    </div>
    <div class="video-meta">
      <div class="video-title" id="videoTitle"></div>
      <div class="video-sub">
        <span id="videoUploader"></span>
        <span id="videoDuration"></span>
        <span id="videoViews"></span>
      </div>
    </div>
  </div>

  <!-- Options -->
  <div class="options-card" id="optionsCard">
    <div class="section-label">— Download Options</div>
    <div class="options-grid">
      <div class="opt-group">
        <label>Format</label>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btnVideo" onclick="setFormat('video')">▶ Video</button>
          <button class="toggle-btn" id="btnAudio" onclick="setFormat('audio')">♪ Audio MP3</button>
        </div>
      </div>
      <div class="opt-group" id="qualityGroup">
        <label>Quality</label>
        <select class="select-styled" id="qualitySelect">
          <option value="4k">4K Ultra HD</option>
          <option value="1080p" selected>1080p Full HD</option>
          <option value="720p">720p HD</option>
          <option value="480p">480p SD</option>
          <option value="360p">360p Low</option>
        </select>
      </div>
    </div>
    <div class="dl-btn-wrap">
      <button class="btn btn-download" id="downloadBtn" onclick="startDownload()">
        Download
      </button>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-card" id="progressCard">
    <div class="section-label">— Downloading</div>
    <div class="progress-header">
      <div class="progress-status" id="progressStatus">Preparing...</div>
      <div class="progress-meta" id="progressMeta"></div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-pct" id="progressPct">0<span>%</span></div>
  </div>

  <!-- Done -->
  <div class="done-card" id="doneCard">
    <div class="done-header">
      <div class="done-icon">✓</div>
      <div>
        <div class="done-title">Download Complete</div>
        <div class="done-sub" id="doneFilename"></div>
      </div>
    </div>
    <div class="done-actions">
      <a id="downloadLink" href="#"><button class="btn">Save File</button></a>
      <button class="btn btn-ghost" onclick="reset()">Download Another</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-note">
      Powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> + FFmpeg.<br>
      For personal use only. Respect copyright.
    </div>
    <div class="footer-badge">YTDL // LOCAL</div>
  </div>

</div>

<script>
  let currentFormat = 'video';
  let currentJobId = null;
  let pollInterval = null;

  function setFormat(fmt) {
    currentFormat = fmt;
    document.getElementById('btnVideo').classList.toggle('active', fmt === 'video');
    document.getElementById('btnAudio').classList.toggle('active', fmt === 'audio');
    document.getElementById('qualityGroup').style.opacity = fmt === 'audio' ? '0.4' : '1';
    document.getElementById('qualityGroup').style.pointerEvents = fmt === 'audio' ? 'none' : '';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '⚠ ' + msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 6000);
  }

  async function fetchInfo() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { showError('Please paste a YouTube URL.'); return; }

    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Fetching';

    document.getElementById('videoInfo').classList.remove('show');
    document.getElementById('optionsCard').classList.remove('show');
    document.getElementById('errorMsg').classList.remove('show');

    try {
      const res = await fetch('/api/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      document.getElementById('thumbnail').src = data.thumbnail || '';
      document.getElementById('videoTitle').textContent = data.title || 'Unknown';
      document.getElementById('videoUploader').textContent = '👤 ' + (data.uploader || '');
      document.getElementById('videoDuration').textContent = '⏱ ' + (data.duration || '');
      const views = data.view_count ? '👁 ' + Number(data.view_count).toLocaleString() : '';
      document.getElementById('videoViews').textContent = views;

      // Populate quality options from available formats
      if (data.formats && data.formats.length > 0) {
        const sel = document.getElementById('qualitySelect');
        sel.innerHTML = '';
        data.formats.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.height + 'p';
          opt.textContent = f.height >= 2160 ? '4K Ultra HD' : f.label + (f.height >= 1080 ? ' Full HD' : f.height >= 720 ? ' HD' : ' SD');
          if (f.height === 1080) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      document.getElementById('videoInfo').classList.add('show');
      document.getElementById('optionsCard').classList.add('show');

    } catch (e) {
      showError(e.message || 'Could not fetch video info.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  }

  async function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    const quality = document.getElementById('qualitySelect').value;

    document.getElementById('optionsCard').classList.remove('show');
    document.getElementById('videoInfo').classList.remove('show');
    document.getElementById('progressCard').classList.add('show');
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressPct').innerHTML = '0<span>%</span>';
    document.getElementById('progressStatus').textContent = 'Starting download...';

    try {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format: currentFormat, quality })
      });
      const data = await res.json();
      currentJobId = data.job_id;
      pollInterval = setInterval(pollProgress, 800);
    } catch (e) {
      showError('Failed to start download: ' + e.message);
      document.getElementById('progressCard').classList.remove('show');
      document.getElementById('optionsCard').classList.add('show');
    }
  }

  async function pollProgress() {
    if (!currentJobId) return;
    try {
      const res = await fetch('/api/progress/' + currentJobId);
      const data = await res.json();

      const pct = data.progress || 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPct').innerHTML = pct + '<span>%</span>';

      if (data.status === 'downloading') {
        document.getElementById('progressStatus').textContent = 'Downloading...';
        let meta = '';
        if (data.speed) meta += data.speed;
        if (data.eta) meta += '  ETA ' + data.eta;
        document.getElementById('progressMeta').textContent = meta;
      } else if (data.status === 'processing') {
        document.getElementById('progressStatus').textContent = 'Processing with FFmpeg...';
        document.getElementById('progressMeta').textContent = '';
      } else if (data.status === 'done') {
        clearInterval(pollInterval);
        document.getElementById('progressCard').classList.remove('show');
        document.getElementById('doneCard').classList.add('show');
        document.getElementById('doneFilename').textContent = data.filename || '';
        document.getElementById('downloadLink').href = '/api/file/' + currentJobId;
      } else if (data.status === 'error') {
        clearInterval(pollInterval);
        document.getElementById('progressCard').classList.remove('show');
        showError(data.error || 'Download failed.');
        document.getElementById('optionsCard').classList.add('show');
        document.getElementById('videoInfo').classList.add('show');
      }
    } catch (e) { /* ignore transient errors */ }
  }

  function reset() {
    clearInterval(pollInterval);
    currentJobId = null;
    document.getElementById('urlInput').value = '';
    document.getElementById('videoInfo').classList.remove('show');
    document.getElementById('optionsCard').classList.remove('show');
    document.getElementById('progressCard').classList.remove('show');
    document.getElementById('doneCard').classList.remove('show');
    document.getElementById('errorMsg').classList.remove('show');
  }

  // Allow pressing Enter in URL field
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchInfo();
  });
</script>
</body>
</html>
